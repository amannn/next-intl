name: release

# A single workflow file so npm Trusted Publishing can be configured against it.
# The branch determines which release runs: `main` → stable (latest), `canary`
# → prerelease (canary). Only the job matching the pushed branch runs.
on:
  push:
    branches:
      - main
      - canary
  # Manual recovery for a release whose npm publish failed partway through.
  #
  # The push-triggered release below bumps versions, commits, tags and creates
  # the GitHub release, and only THEN publishes each package to npm. If npm fails
  # mid-publish (e.g. a transient `504 Gateway Timeout`), some packages end up
  # live at the new version while others are left behind — but the version bump
  # and tag are already pushed.
  #
  # Do NOT re-run the failed release job in that case: it would run `lerna
  # publish` again and bump a brand-new version. Instead, dispatch this workflow
  # with `ref` set to the release tag that failed to fully publish (e.g.
  # `v4.13.4`). It runs `lerna publish from-package`, which publishes only the
  # packages whose version is missing from the registry and skips the rest — it
  # never bumps versions or creates tags.
  #
  # This lives in the same file as the automatic release on purpose: npm Trusted
  # Publishing is bound to a specific workflow filename, so recovery must run
  # from `release.yml` to be authorized to publish (a separate workflow file
  # produces an unrecognized OIDC identity and npm rejects the publish).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag/commit to publish from (e.g. v4.13.4)'
        required: true

permissions: {}

jobs:
  stable:
    name: stable (latest)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push version commits and tags, create GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On push this is empty and checkout uses the triggering commit; on
          # manual recovery it checks out the given release tag.
          ref: ${{ github.event.inputs.ref }}
          # Lerna pushes the version commit and tag with these credentials
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          # Fresh install from the registry, so a poisoned cache can't run in a job that can publish
          package-manager-cache: false
      - run: npm install -g npm@12.2.2 # Trusted publishing needs npm >= 11.5.1 # zizmor: ignore[adhoc-packages]
      - run: pnpm install --frozen-lockfile
      - env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      # Automatic release: bump versions, tag and publish on a fix/feat commit.
      - run: pnpm run release
        if: "${{github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'fix: ') || startsWith(github.event.head_commit.message, 'feat: ') || startsWith(github.event.head_commit.message, 'feat!: '))}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN since we use Trusted Publishers
      # Manual recovery: publish only the packages missing from the registry.
      - run: pnpm exec lerna publish from-package --yes
        if: "${{github.event_name == 'workflow_dispatch'}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN since we use Trusted Publishers

  canary:
    name: prerelease (canary)
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push version commits and tags, create GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          # Fresh install from the registry, so a poisoned cache can't run in a job that can publish
          package-manager-cache: false
      - run: npm install -g npm@12.2.2 # Trusted publishing needs npm >= 11.5.1 # zizmor: ignore[adhoc-packages]
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter './packages/**'
      - env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      # Change workspace dependencies from "workspace:^" to "workspace:"
      - run: |
          sed -i 's/"use-intl": "workspace:\^"/"use-intl": "workspace:"/' ./packages/next-intl/package.json && \
          sed -i 's/"next-intl-swc-plugin-extractor": "workspace:\^"/"next-intl-swc-plugin-extractor": "workspace:"/' ./packages/next-intl/package.json && \
          git commit -am "use fixed version"
      - run: pnpm lerna publish 0.0.0-canary-${GITHUB_SHA::7} --no-git-reset --dist-tag canary --no-push --yes
        if: "${{startsWith(github.event.head_commit.message, 'fix: ') || startsWith(github.event.head_commit.message, 'feat: ') || startsWith(github.event.head_commit.message, 'feat!: ')}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN since we use Trusted Publishers
