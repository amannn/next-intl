name: release

# A single workflow file so npm Trusted Publishing can be configured against it.
# The branch determines which release runs: `main` → stable (latest), `canary`
# → prerelease (canary). Only the job matching the pushed branch runs.
on:
  push:
    branches:
      - main
      - canary

permissions: {}

jobs:
  stable:
    name: stable (latest)
    if: "${{github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'fix: ') || startsWith(github.event.head_commit.message, 'feat: ') || startsWith(github.event.head_commit.message, 'feat!: '))}}"
    runs-on: ubuntu-latest
    # npm's trusted publisher config requires this environment
    environment: npm-publish
    permissions:
      contents: write # Push version commits and tags, create GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lerna pushes the version commit and tag with these credentials
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          # Fresh install from the registry, so a poisoned cache can't run in a job that can publish
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Uploads the new versions to npm, but they only go live once a maintainer
      # approves them with 2FA (see CONTRIBUTORS.md). `pnpm stage` needs pnpm 12.
      - run: npx --yes pnpm@12.18.0 -r --filter './packages/**' stage publish --access public --provenance --no-git-checks # zizmor: ignore[adhoc-packages]
        env:
          # Keeps pnpm 12 from switching to the repo's `packageManager` version
          npm_config_manage_package_manager_versions: false
          # No NODE_AUTH_TOKEN since we use Trusted Publishers
      # A draft, so it's only published once the npm versions are live
      - run: |
          tag=$(git tag --points-at HEAD --list 'v*')
          [ -z "$tag" ] || gh release create "$tag" --draft --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  canary:
    name: prerelease (canary)
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push version commits and tags, create GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          # Fresh install from the registry, so a poisoned cache can't run in a job that can publish
          package-manager-cache: false
      - run: npm install -g npm@12.2.2 # Trusted publishing needs npm >= 11.5.1 # zizmor: ignore[adhoc-packages]
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter './packages/**'
      - env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      # Change workspace dependencies from "workspace:^" to "workspace:"
      - run: |
          sed -i 's/"use-intl": "workspace:\^"/"use-intl": "workspace:"/' ./packages/next-intl/package.json && \
          sed -i 's/"next-intl-swc-plugin-extractor": "workspace:\^"/"next-intl-swc-plugin-extractor": "workspace:"/' ./packages/next-intl/package.json && \
          git commit -am "use fixed version"
      - run: pnpm lerna publish 0.0.0-canary-${GITHUB_SHA::7} --no-git-reset --dist-tag canary --no-push --yes
        if: "${{startsWith(github.event.head_commit.message, 'fix: ') || startsWith(github.event.head_commit.message, 'feat: ') || startsWith(github.event.head_commit.message, 'feat!: ')}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN since we use Trusted Publishers
